global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: harmonet

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: harmonet
    static_configs:
      - targets: ["harmonet:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
    # redis_exporter가 있을 경우 활성화
    # targets: ["redis-exporter:9121"]
